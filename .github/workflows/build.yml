name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Build exe
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Build installer
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          iscc /DAppVersion=$version installer\ScreenLoupe.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist\ScreenLoupe-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ScreenLoupe-Setup.exe" | Out-File dist\checksums.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLoupe-Setup
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\ScreenLoupe-Setup.exe dist\checksums.txt --title "Screen Loupe $env:GITHUB_REF_NAME" --generate-notes
